[workspace]
resolver = "2"
members = [
    "prefrontal-protocol",
    "prefrontal-core",
    "prefrontald",
    "prefrontal-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/buckster123/Prefrontal-RS"

[workspace.dependencies]
prefrontal-protocol = { path = "prefrontal-protocol" }
prefrontal-core = { path = "prefrontal-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
