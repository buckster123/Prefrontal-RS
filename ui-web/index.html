<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prefrontal</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-icon">🧠</span>
      <h1>Prefrontal</h1>
      <span class="brand-sub">executive function as a service</span>
    </div>
    <div class="conn" id="conn" title="daemon connection">●</div>
  </header>

  <section class="stats" id="stats" aria-label="overview">
    <!-- stat tiles injected -->
  </section>

  <section class="controls">
    <input id="filter" type="search" placeholder="filter cards · search code, docs & commits everywhere…"
           autocomplete="off" spellcheck="false">
  </section>

  <section class="search-results" id="search-results" hidden>
    <h2>🔎 content hits <span class="count" id="search-count"></span></h2>
    <div class="hit-list" id="hit-list"></div>
  </section>

  <section class="search-results" id="cortex-results" hidden>
    <h2>🧠 semantic recall <span class="count" id="cortex-count"></span></h2>
    <div class="hit-list" id="cortex-list"></div>
  </section>

  <details class="health" id="health" aria-label="needs attention" hidden>
    <summary>
      <span class="warn-mark">⚠</span>
      <span id="health-summary">needs attention</span>
      <span class="chev">▾</span>
    </summary>
    <div class="health-list" id="health-list"></div>
  </details>

  <details class="timeline" id="timeline" aria-label="where was I" open hidden>
    <summary>
      <span class="tl-mark">⏪</span>
      <span id="timeline-summary">where was I</span>
      <span class="chev">▾</span>
    </summary>
    <div class="tl-list" id="tl-list"></div>
  </details>

  <details class="colony" id="colony" aria-label="colony" hidden>
    <summary>
      <span class="col-mark">⬡</span>
      <span id="colony-summary">colony</span>
      <span class="chev">▾</span>
    </summary>
    <div class="colony-list" id="colony-list"></div>
  </details>

  <main id="groups">
    <!-- activity groups injected -->
  </main>

  <div class="overlay" id="overlay" hidden>
    <div class="panel" role="dialog" aria-modal="true">
      <header class="panel-head">
        <span class="panel-title" id="panel-title"></span>
        <span class="panel-path" id="panel-path"></span>
        <span class="panel-actions">
          <button id="btn-new" type="button">＋ note</button>
          <button id="btn-edit" type="button" hidden>edit</button>
          <button id="btn-save" type="button" hidden>save</button>
          <button id="btn-cancel" type="button" hidden>cancel</button>
          <button id="btn-close" type="button" title="close (Esc)">✕</button>
        </span>
      </header>
      <div class="panel-body">
        <nav class="doc-list" id="doc-list"></nav>
        <div class="doc-main">
          <input id="doc-filename" class="doc-filename" hidden
                 autocomplete="off" spellcheck="false" placeholder="notes/my-idea.md">
          <div class="doc-view md" id="doc-view"></div>
          <textarea id="doc-editor" class="doc-editor" hidden
                    spellcheck="false" placeholder="capture it before it evaporates…"></textarea>
        </div>
      </div>
      <footer class="panel-status" id="panel-status"></footer>
    </div>
  </div>

  <footer class="foot">
    <span id="foot-note">Prefrontal-RS · phase 2: notes · 127.0.0.1 only</span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
